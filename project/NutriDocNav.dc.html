<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @media (max-width: 860px){
      .nd-desktop-nav{ display:none !important; }
      .nd-mobile-burger{ display:flex !important; }
    }
  </style>
</helmet>
<nav style="position:sticky;top:0;z-index:100;font-family:'Plus Jakarta Sans','Tajawal',sans-serif">
  <div style="background:{{ navBg }};backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);border-bottom:1px solid {{ navBorder }};box-shadow:{{ navShadow }};transition:box-shadow .25s,border-color .25s,background .25s">
    <div style="max-width:1240px;margin:0 auto;padding:0 28px;height:74px;display:flex;align-items:center;gap:28px">
      <a href="Home.dc.html" style="display:flex;align-items:center;gap:11px;text-decoration:none;flex:none">
        <img src="assets/nutridoc-logo.png" alt="NutriDoc logo" width="42" height="42" style="display:block;width:42px;height:42px;object-fit:contain" />
        <span style="display:flex;flex-direction:column;line-height:1">
          <span style="font-family:'Newsreader',serif;font-weight:600;font-size:21px;color:#1B5E20;letter-spacing:-.01em">NutriDoc</span>
          <span style="font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#66BB6A;margin-top:2px">{{ tagline }}</span>
        </span>
      </a>

      <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:4px" class="nd-desktop-nav">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
          <a href="{{ link.href }}" style="{{ link.style }}" style-hover="color:#1B5E20;background:#EAF4EA">{{ link.label }}</a>
        </sc-for>
      </div>

      <div style="display:flex;align-items:center;gap:12px;flex:none">
        <button onClick="{{ onToggleLang }}" aria-label="Toggle language" style="border:1px solid #CDE3CD;background:#fff;color:#1B5E20;font-family:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="background:#EAF4EA">{{ langLabel }}</button>
        <a href="Subscription.dc.html" class="nd-desktop-nav" style="background:#1B5E20;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 20px;border-radius:999px;box-shadow:0 6px 16px rgba(27,94,32,.22)" style-hover="background:#2E7D32">{{ ctaLabel }}</a>
        <button onClick="{{ toggleMenu }}" aria-label="Menu" class="nd-mobile-burger" style="display:none;border:none;background:none;cursor:pointer;padding:8px;color:#1B5E20">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;background:rgba(15,36,23,.45);z-index:200"></div>
    <div style="position:fixed;top:0;{{ drawerSide }}:0;height:100%;width:min(82vw,340px);background:#fff;z-index:201;box-shadow:0 0 50px rgba(0,0,0,.25);padding:24px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <span style="font-family:'Newsreader',serif;font-weight:600;font-size:20px;color:#1B5E20">NutriDoc</span>
        <button onClick="{{ closeMenu }}" aria-label="Close" style="border:none;background:none;cursor:pointer;color:#1B5E20"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
      </div>
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
        <a href="{{ link.href }}" style="text-decoration:none;color:#0F2417;font-weight:600;font-size:17px;padding:13px 12px;border-radius:10px" style-hover="background:#EAF4EA">{{ link.label }}</a>
      </sc-for>
      <a href="Subscription.dc.html" style="margin-top:14px;background:#1B5E20;color:#fff;text-decoration:none;text-align:center;font-weight:700;font-size:16px;padding:14px;border-radius:12px">{{ ctaLabel }}</a>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:74},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;blog&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onToggleLang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, menuOpen: false };
  componentDidMount(){
    this._onScroll = () => {
      const s = window.scrollY > 8;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
    };
    window.addEventListener('scroll', this._onScroll, { passive:true });
  }
  componentWillUnmount(){ window.removeEventListener('scroll', this._onScroll); }
  renderVals(){
    const lang = this.props.lang || 'en';
    const ar = lang === 'ar';
    const active = this.props.active || 'home';
    const defs = [
      { key:'home', en:'Home', ar:'الرئيسية', href:'Home.dc.html' },
      { key:'about', en:'About', ar:'من نحن', href:'About.dc.html' },
      { key:'services', en:'Services', ar:'الخدمات', href:'Services.dc.html' },
      { key:'blog', en:'Blog', ar:'المدونة', href:'Blog.dc.html' },
      { key:'contact', en:'Contact', ar:'تواصل معنا', href:'Contact.dc.html' },
    ];
    const base = 'text-decoration:none;font-weight:600;font-size:15px;padding:9px 15px;border-radius:999px;transition:.18s;white-space:nowrap;';
    const links = defs.map(d => ({
      href: d.href,
      label: ar ? d.ar : d.en,
      style: base + (d.key === active ? 'color:#1B5E20;background:#EAF4EA;' : 'color:#3C4A40;background:transparent;')
    }));
    return {
      links,
      tagline: ar ? 'عِش بصحة' : 'LIVE HEALTHY',
      ctaLabel: ar ? 'اشترك الآن' : 'Subscribe Now',
      langLabel: ar ? 'EN' : 'العربية',
      menuOpen: this.state.menuOpen,
      drawerSide: ar ? 'left' : 'right',
      navBg: this.state.scrolled ? 'rgba(255,255,255,.88)' : 'rgba(255,255,255,.7)',
      navBorder: this.state.scrolled ? '#E2EBE3' : 'transparent',
      navShadow: this.state.scrolled ? '0 6px 24px rgba(15,36,23,.07)' : 'none',
      onToggleLang: this.props.onToggleLang || (()=>{}),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
