<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <meta name="description" content="Explore NutriDoc's services: personalized nutrition plans, weight management, clinical nutrition counseling, drug-nutrition review, sports nutrition, and online consultation.">
  <meta name="keywords" content="nutrition services Riyadh, clinical nutrition, drug nutrition interaction, weight management program, sports nutrition, online dietitian">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Nutrition Services | NutriDoc — Dr. Karim Eltaher">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","name":"NutriDoc Nutrition Services","provider":{"@type":"Person","name":"Dr. Karim Eltaher"},"serviceType":"Nutrition Consultation","areaServed":"Saudi Arabia"}</script>
  <style>*{box-sizing:border-box;} html,body{margin:0;padding:0;}
    @media (max-width:880px){.nd-h1{font-size:42px !important;}.nd-3col{grid-template-columns:1fr !important;}}
    @media (max-width:560px){.nd-h1{font-size:34px !important;}.nd-sec{padding-left:20px !important;padding-right:20px !important;}}
  </style>
</helmet>
<div style="font-family:'Plus Jakarta Sans','Tajawal',sans-serif;color:#0F2417;background:#fff;overflow-x:hidden">
  <dc-import name="NutriDocNav" active="services" lang="{{ lang }}" onToggleLang="{{ toggleLang }}" hint-size="100%,74px"></dc-import>
  <main>
    <section style="background:#F7FAF7;border-bottom:1px solid #E8F0E9">
      <div class="nd-sec" style="max-width:820px;margin:0 auto;padding:84px 28px 76px;text-align:center">
        <span style="font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#2E7D32">{{ eyebrow }}</span>
        <h1 class="nd-h1" style="font-family:'Newsreader',serif;font-weight:500;font-size:52px;line-height:1.08;margin:14px 0 16px;letter-spacing:-.02em">{{ h1 }}</h1>
        <p style="font-size:18px;line-height:1.7;color:#5C6E61;margin:0 auto;max-width:56ch">{{ intro }}</p>
      </div>
    </section>

    <section class="nd-sec" style="max-width:1180px;margin:0 auto;padding:84px 28px">
      <div class="nd-3col" style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
        <sc-for list="{{ services }}" as="s" hint-placeholder-count="6">
          <div style="{{ s.cardStyle }}">
            <sc-if value="{{ s.featured }}" hint-placeholder-val="{{ false }}">
              <span style="display:inline-block;background:#A5D6A7;color:#1B5E20;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:999px;margin-bottom:16px">{{ uniqueLabel }}</span>
            </sc-if>
            <div style="width:54px;height:54px;border-radius:14px;background:{{ s.iconBg }};display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:{{ s.iconColor }}" innerHTML="{{ s.icon }}"></div>
            <h3 style="font-size:21px;font-weight:700;margin:0 0 10px;color:{{ s.titleColor }}">{{ s.title }}</h3>
            <p style="font-size:15px;line-height:1.7;margin:0;color:{{ s.descColor }}">{{ s.desc }}</p>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="background:linear-gradient(120deg,#1B5E20,#2E7D32)">
      <div class="nd-sec" style="max-width:820px;margin:0 auto;padding:80px 28px;text-align:center">
        <h2 style="font-family:'Newsreader',serif;font-weight:500;font-size:42px;color:#fff;margin:0 0 14px;letter-spacing:-.02em;text-wrap:balance">{{ ctaH2 }}</h2>
        <p style="font-size:18px;color:#D6E8D8;margin:0 0 30px">{{ ctaSub }}</p>
        <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
          <a href="Subscription.dc.html" style="background:#fff;color:#1B5E20;text-decoration:none;font-weight:700;font-size:16px;padding:16px 30px;border-radius:999px" style-hover="background:#EAF4EA">{{ ctaBtn1 }}</a>
          <a href="Contact.dc.html" style="border:1.5px solid rgba(255,255,255,.5);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:16px 30px;border-radius:999px" style-hover="background:rgba(255,255,255,.12)">{{ ctaBtn2 }}</a>
        </div>
      </div>
    </section>
  </main>
  <dc-import name="NutriDocFooter" lang="{{ lang }}" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en' };
  componentDidMount(){ let l='en'; try{l=localStorage.getItem('nutridoc-lang')||'en';}catch(e){} this.applyLang(l); if(l!==this.state.lang) this.setState({lang:l}); }
  applyLang(l){ document.documentElement.lang=l; document.documentElement.dir = l==='ar'?'rtl':'ltr'; }
  renderVals(){
    const ar = this.state.lang === 'ar';
    const toggleLang = () => { const n=this.state.lang==='ar'?'en':'ar'; try{localStorage.setItem('nutridoc-lang',n);}catch(e){} this.applyLang(n); this.setState({lang:n}); };
    const ic = {
      plan:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2h6a2 2 0 0 1 2 2v0H7v0a2 2 0 0 1 2-2z"/><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>',
      weight:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M21 3l-9 9"/></svg>',
      clinical:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6z"/><path d="M12 8v6M9 11h6"/></svg>',
      drug:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(45 12 12)"/><path d="M9 9l6 6"/></svg>',
      sport:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 6.5l11 11M4 9l2-2M9 4l-2 2M15 20l2-2M20 15l-2 2M7 7l-3 3M17 17l-3 3"/></svg>',
      online:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="14" height="11" rx="2"/><path d="M16 8l6-3v9l-6-3z"/></svg>',
    };
    const data = [
      { k:'plan', icon:ic.plan, featured:false, t_en:'Personalized Nutrition Plans', t_ar:'خطط تغذية مخصصة', d_en:'Custom meal plans built around your body, goals, and lifestyle — not a one-size-fits-all template.', d_ar:'خطط وجبات مخصصة مبنية على جسمك وأهدافك ونمط حياتك — لا حلولاً جاهزة للجميع.' },
      { k:'weight', icon:ic.weight, featured:false, t_en:'Weight Management Program', t_ar:'برنامج إدارة الوزن', d_en:'Evidence-based protocols for sustainable weight loss and lean muscle gain — without crash diets.', d_ar:'بروتوكولات مبنية على الأدلة لفقدان وزن مستدام وبناء عضلات — بلا حميات قاسية.' },
      { k:'clinical', icon:ic.clinical, featured:false, t_en:'Clinical Nutrition Counseling', t_ar:'استشارات التغذية الإكلينيكية', d_en:'Nutrition support for chronic conditions — diabetes, hypertension, PCOS — backed by pharmacy expertise.', d_ar:'دعم تغذوي للحالات المزمنة — السكري، الضغط، تكيس المبايض — مدعوم بخبرة صيدلانية.' },
      { k:'drug', icon:ic.drug, featured:true, t_en:'Drug–Nutrition Interaction Review', t_ar:'مراجعة تفاعل الدواء والغذاء', d_en:'A unique service using clinical pharmacy expertise to check how your medications affect your diet — and vice versa.', d_ar:'خدمة فريدة تستخدم خبرة الصيدلة الإكلينيكية لفحص تأثير أدويتك على نظامك الغذائي والعكس.' },
      { k:'sport', icon:ic.sport, featured:false, t_en:'Sports Nutrition', t_ar:'تغذية رياضية', d_en:'Performance-focused nutrition for athletes and active individuals who want to train and recover smarter.', d_ar:'تغذية موجهة للأداء للرياضيين والأشخاص النشطين الراغبين في تدريب وتعافٍ أذكى.' },
      { k:'online', icon:ic.online, featured:false, t_en:'Online Consultation', t_ar:'استشارة عن بُعد', d_en:'Flexible video or WhatsApp consultation sessions — get expert guidance from anywhere in the Kingdom.', d_ar:'جلسات استشارية مرنة عبر الفيديو أو واتساب — إرشاد متخصص من أي مكان في المملكة.' },
    ];
    const services = data.map(s => ({
      icon: s.icon, featured: s.featured,
      title: ar?s.t_ar:s.t_en, desc: ar?s.d_ar:s.d_en,
      cardStyle: 'border:'+(s.featured?'2px solid #2E7D32':'1px solid #E2EBE3')+';border-radius:20px;padding:32px 30px;background:'+(s.featured?'#0F2417':'#fff')+';box-shadow:0 4px 18px rgba(15,36,23,.04)',
      iconBg: s.featured?'rgba(165,214,167,.18)':'#EAF4EA',
      iconColor: s.featured?'#A5D6A7':'#2E7D32',
      titleColor: s.featured?'#fff':'#0F2417',
      descColor: s.featured?'#9DB6A2':'#5C6E61',
    }));
    return {
      lang: this.state.lang, toggleLang,
      eyebrow: ar?'الخدمات':'What we offer',
      h1: ar?'خدمات تغذية مبنية على العلم':'Nutrition Services, Backed by Science',
      intro: ar?'من الخطط المخصصة إلى مراجعة تفاعل الأدوية مع الغذاء — خدمات تجمع بين خبرة الصيدلة الإكلينيكية وعلم التغذية الحديث.':'From personalized plans to medication–diet reviews — services that combine clinical-pharmacy expertise with modern nutrition science.',
      services, uniqueLabel: ar?'خدمة فريدة':'Unique to NutriDoc',
      ctaH2: ar?'لست متأكداً أي خدمة تناسبك؟':'Not Sure Which Service Fits?',
      ctaSub: ar?'ابدأ بخطة، أو تواصل مع د. كريم مباشرة لتحديد ما يناسبك.':'Start with a plan, or contact Dr. Karim directly to find your best fit.',
      ctaBtn1: ar?'استعرض الخطط':'View Plans',
      ctaBtn2: ar?'تواصل معنا':'Contact Us',
    };
  }
}
</script>
</body>
</html>
